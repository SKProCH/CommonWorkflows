name: 'Build and Publish'
description: 'Builds and publishes NuGet packages using Fallout'
inputs:
  publish-nightly:
    description: 'Should nightly versions be published to feeds'
    required: false
    default: 'false'
  only-build:
    description: 'If this should only build package, and disable any publishing'
    required: false
    default: 'false'
  build-command:
    description: 'Overrides a build command'
    required: false
  test-command:
    description: 'Command to run tests before building'
    required: false
  nuget-user:
    description: 'NuGet user used to publish packages via trusted publishing'
    required: false
  github-token:
    description: 'GitHub Token'
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', '**/packages.lock.json', '**/NuGet.config', '**/Directory.Packages.props') }}

    - name: NuGet login (OIDC → temp API key)
      if: >-
        ${{
          inputs.only-build != 'true' &&
          github.event_name == 'push' &&
          github.event.repository.fork != true &&
          inputs.nuget-user != '' &&
          (
            github.ref_type == 'tag' ||
            (inputs.publish-nightly == 'true' && github.ref_name == github.event.repository.default_branch)
          )
        }}
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ inputs.nuget-user }}

    - name: Build and publish
      run: |
        ACTION_PATH=$(echo "${{ github.action_path }}" | tr '\\' '/')
        dotnet run --project "$ACTION_PATH/../../.fallout/_build.csproj" Pipeline --root . \
          --only-build "${ONLY_BUILD}" --publish-nightly "${PUBLISH_NIGHTLY}"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        ONLY_BUILD: ${{ inputs.only-build }}
        PUBLISH_NIGHTLY: ${{ inputs.publish-nightly }}
        BUILD_COMMAND: ${{ inputs.build-command }}
        TEST_COMMAND: ${{ inputs.test-command }}
